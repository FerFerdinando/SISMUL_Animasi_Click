<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Social 404 🐸</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<link rel="icon" href="../favicon.ico" type="image/x-icon">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a0033;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Silkscreen',monospace;overflow:hidden}
.frog{width:200px;image-rendering:pixelated;margin-bottom:24px}
h1{color:#ff00aa;font-size:clamp(18px,4vw,42px);text-align:center;text-shadow:0 0 30px #ff00aa66;line-height:1.4}
h2{color:#ff00aa;font-size:clamp(18px,4vw,42px);text-align:center;text-shadow:0 0 20px #ff00aa44;line-height:1.4;margin-bottom:40px}
.btn{display:inline-block;padding:16px 40px;font-family:'Silkscreen',monospace;font-size:clamp(14px,2.5vw,26px);color:#fff;background:0;border:2px solid #ff00aa;text-decoration:none;cursor:pointer;animation:pulse 2s ease-in-out infinite;text-shadow:0 0 10px #ff00aa;box-shadow:0 0 20px #ff00aa33;transition:all .2s}
.btn:hover{background:#ff00aa;color:#1a0033;box-shadow:0 0 40px #ff00aa66;animation:none}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 20px #ff00aa33}50%{transform:scale(1.05);box-shadow:0 0 40px #ff00aa66}}
.tag{color:#ff00aa44;font-size:clamp(10px,1.5vw,16px);margin-top:60px;text-align:center}
</style>
</head>
<body>
<h1>Froggy Doesn't Have Social Media</h1>
<img class="frog" src="../Sad.png" alt="sad frog">
<h2>Froggy Ga Punya Sosial Media</h2>
<a class="btn" href="../Sosmed/">Photo games ?</a>
<div class="tag">404 — Social not found</div>
</body>
</html>
